[project]
name = "mempalace-st"
version = "5.9.0"
description = "MemPalace server backend for SillyTavern integration."
requires-python = ">=3.11"
license = "MIT"
authors = [
    {name = "ShinRalexis"},
]
keywords = [
    "ai", "memory", "llm", "rag", "chromadb", "sillytavern",
    "vector-database", "knowledge-graph", "embeddings",
]

[project.urls]
Homepage = "https://github.com/ShinRalexis/Silly-Tavern-MemPalace-Extension"
Repository = "https://github.com/ShinRalexis/Silly-Tavern-MemPalace-Extension"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
